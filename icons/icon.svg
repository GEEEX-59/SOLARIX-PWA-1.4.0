<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4" />

  <!-- Sun Rays & Sun Core with Glow -->
  <g filter="url(#glow)">
    <!-- Sun Ray Accents -->
    <circle cx="256" cy="180" r="100" fill="#f59e0b" fill-opacity="0.15" />
    <!-- Rising Sun Core -->
    <circle cx="256" cy="190" r="76" fill="url(#sunGrad)" />
    <!-- Sun rays -->
    <path d="M256 70v30M256 310v-20M136 190h30M376 190h-30M171 105l22 22M341 275l-22-22M171 275l22-22M341 105l-22 22" 
          stroke="#fde047" stroke-width="12" stroke-linecap="round" stroke-opacity="0.9" />
  </g>

  <!-- Photovoltaic Solar Panel Silhouette in foreground -->
  <g transform="translate(106, 260)">
    <!-- Base Panel Perspective Grid -->
    <path d="M50 160 L250 160 L280 20 L20 20 Z" fill="#0369a1" fill-opacity="0.9" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Panel Grid lines -->
    <!-- Horizontal separators -->
    <path d="M30 65 L270 65 M40 110 L260 110" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.8" />
    <!-- Vertical separators (perspective) -->
    <path d="M105 20 L95 160 M150 20 L150 160 M195 20 L205 160" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.8" />

    <!-- Panel mount support / stand -->
    <path d="M150 160 L150 200 M110 200 L190 200" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Energy Lightning Bolt Accent -->
  <path d="M276 160 L246 205 L266 205 L236 250 L276 195 L256 195 Z" fill="#ffffff" filter="url(#glow)" />
</svg>
